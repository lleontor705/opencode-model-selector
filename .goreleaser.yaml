version: 2

builds:
  - main: ./cmd
    binary: opencode-model-selector
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "opencode-model-selector_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    include:
      - "^feat"
      - "^fix"
      - "^refactor"
      - "^perf"
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore\\(deps\\)"
